# OrchestrAI only. Shared ingress uses host networking; application is loopback.
server {
    listen 80;
    listen [::]:80;
    server_name orchestrai.elysiumgrid.space;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name orchestrai.elysiumgrid.space;
    ssl_certificate /etc/letsencrypt/live/orchestrai.elysiumgrid.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orchestrai.elysiumgrid.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 26m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /health { return 404; }
    location ~ ^/(?:api/openapi|api/keys|api/diagnostics|api/rum|readyz|health) { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
