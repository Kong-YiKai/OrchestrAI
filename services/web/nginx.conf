map $http_x_forwarded_proto $orchestrai_proto {
    default $scheme;
    https https;
    http http;
}
server {
    listen 8080;
    server_name _;
    client_max_body_size 26m;
    location = /health {
        access_log off;
        return 200 'ok';
    }
    location ^~ /assets/ {
        root /srv/ui;
        try_files $uri =404;
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }
    location / {
        proxy_pass http://chat:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $orchestrai_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
