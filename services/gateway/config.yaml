# Chat models are added at startup from models.json by render.py (only those with a key).
model_list:
  - model_name: text-embedding-v4
    litellm_params:
      model: openai/text-embedding-v4
      api_key: os.environ/EMBEDDING_API_KEY
      api_base: os.environ/EMBEDDING_BASE_URL
      dimensions: 1024
      timeout: 45
      max_retries: 0
      max_parallel_requests: 1
router_settings:
  num_retries: 0
  timeout: 180
general_settings:
  master_key: os.environ/GATEWAY_KEY
  disable_spend_logs: true
litellm_settings:
  callbacks: [budget.proxy_handler_instance]
  drop_params: true
  telemetry: false
  set_verbose: false
  turn_off_message_logging: true
