services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orchestrai
      POSTGRES_USER: orchestrai
      POSTGRES_PASSWORD: orchestrai
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrai"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      labels:
        com.orchestrai.service: backend
    image: orchestrai/backend:latest
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://orchestrai:orchestrai@db:5432/orchestrai
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      labels:
        com.orchestrai.service: frontend
    image: orchestrai/frontend:latest
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
