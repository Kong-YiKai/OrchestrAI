name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main-source-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure main receives same-repository develop PRs
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$EVENT" == pull_request && "$BASE" == main && ( "$HEAD" != develop || "$SOURCE_REPO" != "$REPOSITORY" ) ]]; then
            echo 'main only accepts develop from this repository'; exit 1
          fi

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - name: Hygiene and mandatory overview update
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]]; then
            python scripts/check-repository.py --base "$base"
          else
            python scripts/check-repository.py
          fi
          git diff --check
          python scripts/test-release.py
      - name: Validate workflow and shell scripts
        run: |
          docker run --rm -v "$PWD:/repo:ro" --workdir /repo rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
          docker run --rm -v "$PWD:/repo:ro" --workdir /repo --entrypoint shellcheck rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 deploy/install-host.sh deploy/postgres-init.sh deploy/ingestion-init.sh scripts/docker-clean.sh
      - name: Verify fixed upstream archives and OrchestrAI patch
        run: python scripts/prepare-upstreams.py
      - name: Scan tracked source for secrets
        run: |
          mkdir -p .artifacts/source-scan
          git archive HEAD | tar -x -C .artifacts/source-scan
          docker run --rm -v "$PWD/.artifacts/source-scan:/source:ro" aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa fs --scanners secret --exit-code 1 /source

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint -- --quiet
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: backend}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt pytest pytest-asyncio aiosqlite
      - run: python -m pytest tests -q

  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/workflow/package-lock.json
      - name: Dependency and module checks
        working-directory: services/workflow
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=moderate
          npm run check
          npx knip
          npm sbom --omit=dev --sbom-format spdx > ../../workflow.spdx.json
      - name: Real database, queue, crash, HTTP restart and restore checks
        env:
          BUILD_REVISION: ${{ github.sha }}
        run: python scripts/test-services.py
      - name: Scan every tested production image
        run: |
          mkdir -p .artifacts/image-scans
          status=0
          for service in workflow postgres redis; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v orchestrai-trivy-cache:/root/.cache -v "$PWD/.artifacts/image-scans:/reports" aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output "/reports/$service.json" "orchestrai/$service:local" || status=1
          done
          if [[ "$status" != 0 ]]; then exit "$status"; fi
          docker save orchestrai/workflow:local orchestrai/postgres:local orchestrai/redis:local -o release-images.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: image-scans-${{ github.sha }}
          path: .artifacts/image-scans/*.json
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workflow-${{ github.sha }}
          path: |
            release-images.tar
            workflow.spdx.json
          retention-days: 7

  ci-gate:
    if: always()
    needs: [main-source-guard, repository, frontend, backend, workflow, product]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python -c 'import os,json; assert all(j["result"] == "success" for j in json.loads(os.environ["RESULTS"]).values())'

  product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build fixed product images and check client types
        env:
          BUILD_REVISION: ${{ github.sha }}
        run: python scripts/build-product.py
      - name: Atomic budget, restart and SDK callback contract
        run: |
          docker run --rm -e LITELLM_LOCAL_MODEL_COST_MAP=true -v "$PWD/services/gateway/test_budget.py:/app/test_budget.py:ro" --entrypoint python orchestrai/gateway:local -m unittest test_budget -q
          docker run --rm --entrypoint python orchestrai/ingestion:local -m compileall -q /app/app /app/migrate.py
      - name: Candidate auth, upload and chat delegation with no paid calls
        run: |
          docker build -f deploy/infrastructure.Dockerfile --target postgres -t orchestrai/postgres:local deploy
          docker build -f deploy/infrastructure.Dockerfile --target redis -t orchestrai/redis:local deploy
          docker build --target runtime -t orchestrai/workflow:local services/workflow
          mkdir -p .artifacts/product-inputs
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('.artifacts/product-inputs')
          (p/'providers.json').write_text(json.dumps({'embedding_api_key':'test-unused-provider-key','embedding_base_url':'https://unused.invalid/v1','embedding_model':'text-embedding-v4','embedding_dimensions':1024}))
          (p/'model.env').write_text('DEEPSEEK_API_KEY=test-unused-provider-key\n')
          PY
          python scripts/configure-product.py --providers .artifacts/product-inputs/providers.json --model-env .artifacts/product-inputs/model.env
          python scripts/test-product.py --start --project orchestrai-r3-ci
      - name: Product image security reports
        run: |
          mkdir -p .artifacts/product-scans
          status=0
          for service in chat ingestion gateway web; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v orchestrai-trivy-cache:/root/.cache -v "$PWD/.artifacts/product-scans:/reports" aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output "/reports/$service.json" "orchestrai/$service:local" || status=1
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v orchestrai-trivy-cache:/root/.cache -v "$PWD/.artifacts/product-scans:/reports" aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --format spdx-json --output "/reports/$service.spdx.json" "orchestrai/$service:local" || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: product-scans-${{ github.sha }}
          path: .artifacts/product-scans/*.json
          retention-days: 30

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      manifest: ${{ steps.release.outputs.manifest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: 'workflow-${{ github.sha }}'}
      - name: Publish the exact tested image and release manifest
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          SEQUENCE: ${{ github.run_number }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker load -i release-images.tar
          for service in workflow postgres redis; do
            image="ghcr.io/${REPOSITORY,,}/$service"
            docker tag "orchestrai/$service:local" "$image:$REVISION"
            docker push "$image:$REVISION"
            docker inspect --format '{{index .RepoDigests 0}}' "$image:$REVISION" > "$service.digest"
          done
          python - <<'PY'
          import importlib.util,json,os,pathlib
          spec=importlib.util.spec_from_file_location('release','deploy/release.py')
          release=importlib.util.module_from_spec(spec); spec.loader.exec_module(release)
          images={service:pathlib.Path(service+'.digest').read_text().strip() for service in ['workflow','postgres','redis']}
          manifest=dict(revision=os.environ['REVISION'],image=images['workflow'],postgres_image=images['postgres'],redis_image=images['redis'],sequence=int(os.environ['SEQUENCE']),schema=1,config_digest=release.config_digest(pathlib.Path('deploy')))
          value=json.dumps(manifest,separators=(',',':'))
          pathlib.Path('release.json').write_text(value)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('manifest='+value+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'release-${{ github.sha }}', path: release.json, retention-days: 90}

  deploy:
    if: vars.R2_DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: orchestrai-production
      cancel-in-progress: false
    steps:
      - name: Submit manifest to restricted deployment identity
        env:
          MANIFEST: ${{ needs.publish.outputs.manifest }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/id_ed25519"' EXIT
          python -c 'import json,os; print(json.dumps(dict(manifest=json.loads(os.environ["MANIFEST"]),registry_username=os.environ["GITHUB_ACTOR"],registry_token=os.environ["REGISTRY_TOKEN"])))' | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IPQoS=none -o ConnectTimeout=20 "orchestrai-deploy@$DEPLOY_HOST" release
